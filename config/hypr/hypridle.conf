# omarchy-configuration: idle auto-suspend.
# Omarchy shell owns screensaver (150s) + lock (300s); hypridle adds only the
# missing step: suspend after __IDLE_SUSPEND_SEC__s idle.
# - Honors fullscreen/video idle-inhibits (ignore_*_inhibit default false).
# - Skips suspend while Omarchy "stay-awake" is on (same state file the shell reads).
general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = omarchy-system-lock
    after_sleep_cmd = omarchy-system-wake
}

listener {
    timeout = __IDLE_SUSPEND_SEC__
    on-timeout = bash -lc '[ ! -f "$HOME/.local/state/omarchy/indicators/stay-awake" ] && exec systemctl suspend'
}
